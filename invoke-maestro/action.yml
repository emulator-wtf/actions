name: invoke-maestro
description: Invoke the ew-cli command to run Maestro flows
inputs:
  # Authentication
  api-token:
    description: 'Api token for emulator.wtf'
    required: false
  # File options
  workspace:
    description: >-
      Directory holding your Maestro flows (the Maestro workspace). The whole directory tree is uploaded, and which
      flows run is decided at run time by the workspace config and tags, exactly like a local `maestro test <dir>` run.
    required: true
  config:
    description: "Workspace config file to use instead of the workspace's own root config.yaml"
    required: false
  flows:
    description: >-
      Flows to run, one per line, in the same format as the workspace config's `flows:` entries
      (e.g. `login.yaml` or `smoke/*.yaml`). Defaults to the flows section in config.yaml.
    required: false
  include-tags:
    description: 'Only run flows carrying at least one of these tags, one tag per line'
    required: false
  exclude-tags:
    description: 'Skip flows carrying any of these tags, one tag per line'
    required: false
  app:
    description: 'Application apk file your flows drive'
    required: true
  additional-apks:
    description: 'Additional apks to install, one per line'
    required: false
  file-cache-ttl:
    description: >-
      Max time to keep cached files in the backend followed by a unit (d, h, m or s), with the maximum value being 7d
      and minimum value being 5m (default: 1h)
    required: false
  file-cache:
    description: >-
      Set to false to disable remote file cache.
      APKs and flows will always be uploaded, even if they were uploaded before.
    required: false
  # Test configuration
  display-name:
    description: "Display name for the test run, this is used to identify the test run in the GitHub integration."
    required: false
  devices:
    description: 'Device configurations to use, in the form of model=X,version=Y per line'
    required: false
  timeout:
    description: >-
      Max time until this test run is cancelled, expressed by a number followed by a unit (h, m or s),
      with the maximum value being 3h and minimum value being 60s.
      Default: 15m.
    required: false
  environment-variables:
    description: >-
      Environment variables to pass to Maestro, one per line in the form of key=value.
      Flows can read them as ${KEY}.
    required: false
  secret-environment-variables:
    description: >-
      Secret environment variables to pass to Maestro, one per line in the form of key=value.
      These are kept out of logs and the results UI. Use this for passing tokens, passwords, credentials, etc.
    required: false
  test-cache:
    description: 'Set to false to disable remote test cache - flows will always re-run, even if they were run before.'
    required: false
  side-effects:
    description: >-
      Indicates that the flows have side effects, i.e. they hit external resources and might be a part of a bigger
      test suite. Adding this flag means that the run will not use the test cache and will not be automatically retried
      in case of errors.
      Default: false.
    required: false
  num-flaky-test-attempts:
    description: >-
      Number of times to re-run shards that had flow failures. Repeat attempts will run in parallel.
      Will not work together with side-effects. Maximum number of attempts is 10.
      Default: 0.
    required: false
  flaky-test-repeat-mode:
    description: >-
      Whether to repeat the whole failed shard (all) or only the failed flows (failed_only) in case of flaky flows.
      A failed flow in a config.yaml executionOrder sequence repeats its whole sequence.
      Default: failed_only.
    required: false
  # Test sharding
  num-balanced-shards:
    description: 'Set to a number larger than 1 to split your flows into even shards based on historical runtime.'
    required: false
  shard-target-runtime:
    description: >-
      Target runtime for each shard in minutes, flows will be split into shards targeting this runtime for each shard
      based on historical data on a best effort basis.
    required: false
  testcase-duration-hint:
    description: >-
      Hint for the average runtime of a flow expressed by a number followed by a unit (h, m, s or ms),
      with the maximum value being 3h and the minimum value being 1ms (default 10s).
      Useful when historical runtime data is missing for flows alongside with `shard-target-runtime` or
      `num-balanced-shards`.
    required: false
  num-shards:
    description: 'Set to a number larger than 1 to split your flows into even shards based on flow count.'
    required: false
  flows-for-shard:
    description: >-
      Specify sharding manually, one shard per line. Each line is a comma-separated list of flows in the same format as
      `flows`, e.g. `login.yaml,checkout/*.yaml`. Flows of a config.yaml executionOrder sequence must all be in the
      same shard.
    required: false
  # Test outputs
  record-video:
    description: 'Set to true to record video of the test run'
    required: false
  directories-to-pull:
    description: 'Directories to pull from device and store in <outputs-dir>, one per line'
    required: false
  outputs:
    description: >-
      Comma-separated list to specify what to download to output-dir.
      Defaults to `merged_results_xml,coverage,pulled_dirs`.
    required: false
  outputs-dir:
    description: 'Location to store test outputs in'
    required: false
  # Network options (emulator)
  dns-server:
    description: >-
      DNS server(s) to use for the emulator, one per line. Can specify up to 4 servers.
      If not specified, the emulator will use default DNS servers.
    required: false
  dns-override:
    description: >-
      Hard-code specific hostname-ip combinations, one per line in the form of hostname=ip (e.g. example.com=10.0.0.1).
    required: false
  egress-tunnel:
    description: >-
      Set to true to enable tunneling outgoing internet traffic from the emulator to the action.
      This will redirect all network traffic as if you were running the emulator within the action.
    required: false
  egress-localhost-fwd-ip:
    description: >-
      When using the egress tunnel, make this action's localhost available to the emulator under the specified
      IP address (should NOT be a public IP, loopback IP or broadcast IP)
    required: false
  # Network options (action)
  proxy-host:
    description: "Configure a proxy host to use for all requests when making emulator.wtf API calls."
    required: false
  proxy-port:
    description: "Configure a proxy port to use for all requests when making emulator.wtf API calls."
    required: false
  proxy-user:
    description: "Set the proxy user to use for authentication."
    required: false
  proxy-password:
    description: "Set the proxy password to use for authentication."
    required: false
  # Operation
  async:
    description: >-
      Run the flows asynchronously, without waiting for the results.
    required: false
branding:
  color: orange
  icon: smartphone
runs:
  using: node24
  main: ../dist/invoke-maestro/main.js
