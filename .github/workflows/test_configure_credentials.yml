name: Test configure-credentials
permissions:
  contents: read
  id-token: write
on:
  pull_request:
    paths:
    # action metadata changes
    - configure-credentials/**
    # sources & direct dependencies
    - src/configure-credentials/**
    - src/lib/**
    # npm/ts config
    - '*.json'
    # workflow file itself
    - .github/workflows/test_configure_credentials.yml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '24'
    - uses: jdx/mise-action@v4.2.1 # zizmor: ignore[unpinned-uses] immutable tag
      with:
        install: false
    - run: mise dist
    - uses: ./configure-credentials
      with:
        oidc-configuration-id: ${{ vars.EW_OIDC_ID }}
    - uses: ./setup-ew-cli
    - run: ew-cli --models
