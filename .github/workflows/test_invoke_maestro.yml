name: Test invoke-maestro
permissions:
  contents: read
  id-token: write
on:
  pull_request:
    paths:
    # action metadata changes
    - invoke-maestro/**
    # sources & direct dependencies
    - src/invoke-maestro/**
    - src/lib/**
    # npm/ts config
    - '*.json'
    # maestro flows used by this test
    - .github/test-fixtures/maestro/**
    # workflow file itself
    - .github/workflows/test_invoke_maestro.yml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Setup Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
    - uses: jdx/mise-action@v5.2.10 # zizmor: ignore[unpinned-uses] immutable tag
      with:
        install: false
    - run: mise dist
    - uses: ./setup-ew-cli
    - uses: ./configure-credentials
      with:
        oidc-configuration-id: ${{ vars.EW_OIDC_ID }}
    - run: curl -o minimal.apk -sS https://maven.emulator.wtf/releases/wtf/emulator/minimal/0.0.2/minimal-0.0.2.apk
    - uses: ./invoke-maestro
      with:
        workspace: .github/test-fixtures/maestro
        app: minimal.apk
